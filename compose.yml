services:  
  sign-excid:
    restart: unless-stopped
    image: ghcr.io/excid-io/staas:1.2.1
    depends_on:
      sign-mariadb:
        condition: service_healthy
    volumes:
    - ./sign/appsettings.Production.json:/App/appsettings.Production.json:ro
    - ./fulcio/fulcio-cert.pem:/App/fulcio-cert.pem:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:6001
      - ConnectionStrings__DefaultConnection=Server=sign-mariadb;Port=3306;Database=sign;User=${MARIADB_USER};Password=${MARIADB_PASSWORD};
      - OpenId__Authority=https://accounts.google.com
      - OpenId__ClientId=${OpenId__ClientId}
      - OpenId__ClientSecret=${OpenId__ClientSecret}
    ports:
      - "6001:6001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6001/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
  sign-mariadb:
    restart: unless-stopped
    image: mariadb:12.3.2
    environment:
      MARIADB_DATABASE: sign
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./mariadb/data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  fulcio-server:
    restart: unless-stopped
    image: ghcr.io/sigstore/fulcio:v1.8.8
    depends_on:
      sign-excid:
        condition: service_healthy
    command: [
      "serve",
      "--host=0.0.0.0",
      "--port=6002",
      "--ca=fileca",
      "--ct-log-url=",
      "--fileca-cert=/etc/fulcio-config/fulcio-cert.pem",
      "--fileca-key=/etc/fulcio-config/fulcio-key.pem",
      "--fileca-key-passwd=${FULCIO_KEY_PASSWORD}",
      "--client-signing-algorithms=ecdsa-sha2-256-nistp256"
      # Uncomment this for production logging
      # "--log_type=prod",
      ]
    #restart: always # keep the server running
    ports:
      - "6002:6002"
    volumes:
      - ./fulcio:/etc/fulcio-config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6002/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
